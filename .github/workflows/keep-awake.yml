name: Keep server awake

# Render's free plan puts the API to sleep after ~15 minutes without traffic, and the first request afterwards
# takes about a minute. This pings the readiness endpoint every 5 minutes so voters never hit a cold start.
# The endpoint also runs a trivial database query, which keeps the Supabase free project active too.
#
# To point it somewhere else, set a repository variable named KEEP_AWAKE_URL (Settings > Secrets and variables > Actions > Variables).

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        env:
          URL: ${{ vars.KEEP_AWAKE_URL || 'https://ida-voting-server.onrender.com/api/health/ready' }}
        run: |
          # A sleeping server can take ~60s to wake, so allow a long timeout and retry a few times.
          curl --fail --silent --show-error --max-time 90 --retry 3 --retry-delay 15 --retry-all-errors "$URL"
          echo
